<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }

  #touch.on { display: block; }
  .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; box-sizing: border-box;
    background: rgba(185, 215, 210, 0.09); border: 1.5px solid rgba(185, 215, 210, 0.34);

  #pad { left: calc(4vmin + env(safe-area-inset-left)); bottom: 6vmin; width: 40vmin; height: 19vmin; border-radius: 9.5vmin; overflow: hidden; }
  #pad .half { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; }

  #tpause { right: calc(3vmin + env(safe-area-inset-right)); top: 3vmin; width: 10vmin; height: 10vmin; }
  #tmute { right: calc(15vmin + env(safe-area-inset-right)); top: 3vmin; width: 10vmin; height: 10vmin; }

<script src="config.js"></script>

<script>
'use strict';
// Sono de Cinza. A partir do starter do one-shot: o passo fixo, o relógio, window.game e as cenas
// play e figures ficam como os checks leem. O mundo está em world.js, a arte em art.js, o som em sfx.js.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = "'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif";
const TITLE = 'Sono de Cinza';
const CONTROLS = ['Setas ou A/D: andar', 'Z ou Espaço: pular (segure para ir mais alto)', 'X: golpear (com ↑, para cima; no ar com ↓, para baixo, e quica)',
  'C: ímpeto, depois que você o ganhar', 'Segurar ↓ parado: curar, gastando calor', 'P: pausa e mapa · M: som · um controle também funciona']; // shown on the title screen
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : Math.min(s * (devicePixelRatio || 1), COARSE ? 1.25 : 2); // teto: celulares não pintam 4K à toa
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
const ACT = { left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'], up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown', 'PadY'],
  jump: ['KeyZ', 'Space', 'PadA'], attack: ['KeyX', 'KeyJ', 'PadX'], dash: ['KeyC', 'KeyK', 'ShiftLeft', 'PadB', 'PadR'], pause: ['KeyP', 'Escape', 'PadStart'] };
// Controle (Bluetooth ou cabo): direcional ou analógico andam; A pula, X golpeia, B ou gatilho direito dão o ímpeto,
// Y ou ↓ curam, Start pausa. Lido a cada quadro e traduzido nas mesmas ações do teclado.
const PADKEYS = ['PadLeft', 'PadRight', 'PadUp', 'PadDown', 'PadA', 'PadB', 'PadX', 'PadY', 'PadR', 'PadStart'], padPrev = {};
function pollPad() {
  if (!navigator.getGamepads) return;
  let gp = null; try { for (const g of navigator.getGamepads()) if (g && g.connected) { gp = g; break; } } catch (e) { return; }
  const now = {};
  if (gp) {
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    now.PadLeft = b(14) || ax < -0.4; now.PadRight = b(15) || ax > 0.4; now.PadUp = b(12) || ay < -0.55; now.PadDown = b(13) || ay > 0.6;
    now.PadA = b(0); now.PadB = b(1); now.PadX = b(2); now.PadY = b(3); now.PadR = b(5) || b(7); now.PadStart = b(9);
  }
  for (const k of PADKEYS) { const on = !!now[k]; if (on && !padPrev[k]) { down.add(k); hit.add(k); startAudio(); } else if (!on && padPrev[k]) down.delete(k); padPrev[k] = on; }
}
const confirmTap = () => pressed('Enter') || pressed('Space') || pressed('KeyZ') || pressed('PadA') || pressed('PadStart');
const held = a => ACT[a].some(c => down.has(c));
const tapped = a => ACT[a].some(c => hit.has(c));
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Tab') e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// ---- Toque (Android): botões na tela que acendem as mesmas teclas -----------------------
let touchUI = false;
const touchEl = document.getElementById('touch');
function touchOn() {
  if (touchUI) return; touchUI = true; touchEl.classList.add('on');
  try { const d = document.documentElement; if (d.requestFullscreen && !document.fullscreenElement) d.requestFullscreen({ navigationUI: 'hide' }).then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }).catch(() => {}); } catch (e) { /* sem tela cheia: joga assim mesmo */ }
}
addEventListener('pointerdown', e => {
  startAudio();
  if (e.pointerType === 'touch') touchOn();
  if (e.target === canvas && scene !== 'play') { // toque na tela sai do título e do fim; no rodapé do título, recomeça do zero
    const r = canvas.getBoundingClientRect(), ly = (e.clientY - r.top) / r.height * H;
    hit.add(scene === 'title' && ly > H - 90 && loadSave() ? 'KeyN' : 'Enter');
  }
});
addEventListener('contextmenu', e => e.preventDefault());
if (params.get('touch')) touchOn(); // ?touch=1 mostra os botões de toque no computador
for (const b of touchEl.querySelectorAll('.tb[data-k]')) {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); b.classList.add('on'); down.add(k); hit.add(k); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); down.delete(k); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
}
{ // o direcional: um botão largo; o lado do dedo decide, e deslizar troca de lado
  const pad = document.getElementById('pad'), L = document.getElementById('padL'), R = document.getElementById('padR');
  const set = side => { for (const [el, k, s] of [[L, 'ArrowLeft', -1], [R, 'ArrowRight', 1]]) { if (side === s) { if (!down.has(k)) hit.add(k); down.add(k); el.classList.add('on'); } else { down.delete(k); el.classList.remove('on'); } } };
  const at = e => { const r = pad.getBoundingClientRect(); set(e.clientX < r.left + r.width / 2 ? -1 : 1); };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture && pad.setPointerCapture(e.pointerId); at(e); });
  pad.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') at(e); });
  for (const n of ['pointerup', 'pointercancel', 'lostpointercapture']) pad.addEventListener(n, () => set(0));
}

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
    soundInit();
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
// Página oculta (app em segundo plano, aba trocada): o jogo pausa e o som para; ao voltar, o som volta.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { down.clear(); if (scene === 'play' && state.mode === 'play') scene = 'pause'; if (audio && audio.ac.suspend) audio.ac.suspend(); }
  else if (audio && audio.ac.state === 'suspended') audio.ac.resume();
});

// ---- O progresso guardado: nada do que você ganhou se perde ---------------------------
const SAVE_KEY = 'sono-de-cinza-v1';
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() {
  if (params.get('room')) return; // sala escolhida pelo endereço: não mexe no save
  const s = state, o = { flags: s.flags, lit: s.lit, seen: s.seen, ecos: s.ecos, deaths: s.deaths, deathHow: s.deathHow, totalDeaths: s.totalDeaths, brasas: s.brasas, level: s.level,
    calor: s.calor, maxLife: s.p.maxLife, spawn: s.spawn, time: Math.round(s.time), wallHp: s.wallHp, dir: dirPack() };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (e) { /* sem armazenamento: o jogo segue sem save */ }
}
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nada a apagar */ } }

// ---- O jogo ---------------------------------------------------------------------------
let scene, state;
const fx = { parts: [], trail: [], shake: 0, kick: 0, zoom: 1, art: null, artRoom: '', snap: null, shards: [], say: null, eco: null, sono: null, dread: 0, titleT: 0, confirmNew: 0 };
const SPEC = {
  carcaca: { w: 40, h: 70, hp: 'carcaca_life', brasas: 2, kb: 70 },
  mariposa: { w: 30, h: 24, hp: 'mariposa_life', brasas: 1, kb: 260 },
  espinheiro: { w: 44, h: 24, hp: 'espinheiro_life', brasas: 1, kb: 150 },
  vigia: { w: 80, h: 104, hp: 'vigia_life', brasas: 10, kb: 0, boss: true },
  enlutada: { w: 60, h: 120, hp: 'enlutada_life', brasas: 20, kb: 0, boss: true },
  rainha: { w: 120, h: 84, hp: 'rainha_life', brasas: 15, kb: 0, boss: true },
};
function makeEnt(d, id) {
  const s = SPEC[d.k];
  const e = { id, k: d.k, x: d.x * T + T / 2 - s.w / 2, y: d.y * T - s.h, w: s.w, h: s.h, vx: 0, vy: 0, hp: tune[s.hp], face: -1, st: 'idle', t: 0, at: 0,
    alive: true, flash: 0, ground: false, hx: 0, hy: 0, hy2: 0, cd: 0, rise: 1, n: 0, tx: 0, ty: 0, alpha: 1, hitWall: 0, last: '', rage: 0, tmp: 0, tilt: 0 };
  if (d.k === 'carcaca' && d.sleeping && !mem('carcaca')) { e.st = 'sleep'; e.rise = 0; e.face = 1; } // quem já te matou muito não dorme mais: espera de pé
  if (d.k === 'mariposa') { e.y = d.y * T - s.h / 2; e.hx = e.x + s.w / 2; e.hy = d.y * T; e.st = 'hover'; e.cd = 0.8; }
  if (d.k === 'espinheiro') { e.st = 'walk'; e.cd = tune.espinheiro_interval * 0.5; }
  if (d.k === 'vigia') { e.st = 'wait'; e.face = 1; }
  if (d.k === 'enlutada') { e.st = 'wait'; e.y = d.y * T - 44 - s.h; e.hx = e.x; e.hy = e.y; }
  if (d.k === 'rainha') { e.st = 'wait'; e.y = d.y * T - 290 - s.h / 2; e.hx = e.x; e.hy = e.y; }
  return e;
}
function newPlayer(x, y) {
  return { x, y, w: 22, h: 38, vx: 0, vy: 0, face: 1, ground: false, coy: 0, buf: 0, jumping: false, jump2: false, land: 0, atk: -1, atkCd: 0, atkDir: 0, atkHit: [],
    dashT: 0, dashCd: 0, dashUsed: false, dashDir: 1, inv: 0, lock: 0, heal: 0, life: tune.player_life, maxLife: tune.player_life, t: 0, safeX: x, safeY: y, hitWall: 0 };
}
function enterRoom(id, x, y) {
  const r = ROOMS[id]; state.room = id; state.seen[id] = true; state.shots = []; state.ents = []; state.fight = false; state.endGrow = 0;
  r.ents.forEach((d, i) => { const eid = id + ':' + i; if (!state.dead[eid]) state.ents.push(makeEnt(d, eid)); });
  if (r.boss && !state.flags[r.boss.k]) state.ents.push(makeEnt(r.boss, id + ':boss'));
  const p = state.p; p.x = x; p.y = y; p.safeX = x; p.safeY = y;
  const VW = W / fx.zoom, VH = H / fx.zoom;
  state.cam.x = clamp(p.x + p.w / 2 - VW / 2, 0, r.w * T - VW); state.cam.y = clamp(p.y + p.h / 2 - VH * 0.58, 0, r.h * T - VH);
  state.fade = 1; fx.parts.length = 0; fx.trail.length = 0; fx.say = null; fx.kick = 0;
  dirEnter(id); // o Sono olha quem entrou, e talvez mexa em alguma coisa
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  // state.gained: what this run gained or learned, the high the ending shows.
  const st = ROOMS.R1.start, px = st.x * T, py = st.y * T - 38;
  state = { t: 0, time: 0, score: 0, gained: '', mode: 'wake', modeT: 0, room: 'R1', p: newPlayer(px, py), cam: { x: 0, y: 0 },
    flags: { impeto: false, asas: false, lamina: false, fragmento: false, atalho: false, vigia: false, rainha: false, enlutada: false, quebrada: false, ravina: false, muro: false },
    lit: {}, seen: {}, ecos: {}, deaths: {}, deathHow: {}, bye: {}, wind: 0, poseItem: '', totalDeaths: 0, brasas: 0, level: 1, calor: 0, wallHp: 2, spawn: { room: 'R1', x: px, y: py },
    ents: [], shots: [], dead: {}, greeted: {}, fight: false, hitstop: 0, fade: 1, killer: '', killLine: '', killBy: '', killCount: 0, banner: null, endGrow: 0, won: false, first: true };
  dirReset(); // o Sono começa sem memória, e o mundo volta a ser como foi feito
  const dbg = params.get('room'); // ?room=R5&impeto=1&lamina=1: começa numa sala, para olhar e testar
  if (dbg && ROOMS[dbg]) {
    if (params.get('impeto')) state.flags.impeto = true;
    if (params.get('lamina')) state.flags.lamina = true;
    if (params.get('asas')) state.flags.asas = true;
    const r = ROOMS[dbg], sx = Number(params.get('x')) || (r.start ? r.start.x : r.boss ? (r.boss.trigger > r.boss.x ? r.w - 4 : 4) : 4);
    let sy = 0; while (sy < r.h && r.g[sy * r.w + sx] === 1) sy++; while (sy < r.h && r.g[sy * r.w + sx] !== 1) sy++;
    if (params.get('y')) sy = Number(params.get('y'));
    state.spawn = { room: dbg, x: sx * T, y: sy * T - 38 }; state.mode = 'play'; state.first = false;
  }
  enterRoom(state.spawn.room, state.spawn.x, state.spawn.y);
}
function continueGame(sv) {
  reset();
  Object.assign(state.flags, sv.flags || {}); state.lit = sv.lit || {}; state.seen = sv.seen || {}; state.deaths = sv.deaths || {}; state.ecos = sv.ecos || {}; state.deathHow = sv.deathHow || {};
  state.totalDeaths = sv.totalDeaths || 0; state.brasas = sv.brasas || 0; state.level = sv.level || 1; state.calor = sv.calor || 0; state.time = sv.time || 0;
  state.wallHp = sv.wallHp === undefined ? 2 : sv.wallHp; state.p.maxLife = sv.maxLife || tune.player_life; state.p.life = state.p.maxLife;
  if (sv.spawn && ROOMS[sv.spawn.room]) state.spawn = sv.spawn;
  dirLoad(sv); // a memória do Sono e o que ele já mudou no mundo
  state.first = false; enterRoom(state.spawn.room, state.spawn.x, state.spawn.y);
}

// ---- Blocos e colisão -----------------------------------------------------------------
function tileCode(tx, ty) { const r = ROOMS[state.room]; return tx < 0 || ty < 0 || tx >= r.w || ty >= r.h ? 0 : r.g[ty * r.w + tx]; }
const isBranch = c => c === 2 || c === 9; // galhos: seguram só por cima (9 é um galho que o Sono fez nascer)
function tileSolid(tx, ty, enemy) {
  const r = ROOMS[state.room];
  if (tx < 0 || tx >= r.w || ty >= r.h) return !!enemy; // a figura atravessa as bordas onde há saída; os outros ficam
  if (ty < 0) ty = 0; // acima da sala vale a linha de cima: teto fechado segue fechado, céu aberto segue aberto
  const c = r.g[ty * r.w + tx];
  return c === 1 || (c === 4 && !state.flags.quebrada) || (c === 5 && !state.flags.atalho) || (c === 6 && state.fight);
}
function moveBody(b, dt, enemy) {
  b.hitWall = 0;
  let nx = b.x + b.vx * dt;
  const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vx > 0) { const tx = Math.floor((nx + b.w) / T); for (let ty = y0; ty <= y1; ty++) if (tileSolid(tx, ty, enemy)) { nx = tx * T - b.w - 0.01; b.vx = 0; b.hitWall = 1; break; } }

  }
  ctx.restore();

  drawAsh(ctx, t, camx, camy, true, r.mood);
  if (m.ember) drawEmbers(ctx, t, camx, camy, r.mood === 'limiar' || r.mood === 'heart' || r.mood === 'nest' ? PAL.violet : PAL.emberHot);
  if (art.fore) ctx.drawImage(art.fore.c, -Math.round(camx * art.fore.par), VH - H);
  ctx.restore();
  // escuridão com um vão de luz em volta da figura
  const sx = (p.x + p.w / 2 - cx) * Z, sy = (p.y + p.h / 2 - cy) * Z, dg = ctx.createRadialGradient(sx, sy, 90, sx, sy, 620);
  dg.addColorStop(0, 'rgba(2,6,9,0)'); dg.addColorStop(1, `rgba(2,6,9,${m.dark + 0.18})`); ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
  glow(ctx, sx, sy, 190, '#ffd9a8', 0.13);
  if (state.fight) glow(ctx, W / 2, H / 2, 900, PAL.violetDeep, 0.1 + 0.04 * Math.sin(t * 3));
  dirDrawOver(ctx);
  drawVignette(ctx);
}
function drawHUD() {
  const p = state.p; ctx.save();
  for (let i = 0; i < p.maxLife; i++) { // vida: brasas
    const x = 44 + i * 30, y = 46, on = i < p.life;
    if (on) glow(ctx, x, y, 20, PAL.ember, 0.6 + 0.15 * Math.sin(state.t * 5 + i));
    ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.quadraticCurveTo(x + 10, y - 1, x + 6.5, y + 8); ctx.quadraticCurveTo(x, y + 13, x - 6.5, y + 8); ctx.quadraticCurveTo(x - 10, y - 1, x, y - 13); ctx.closePath();
    if (on) { ctx.fillStyle = PAL.ember; ctx.fill(); ctx.fillStyle = '#fff1d0'; ctx.beginPath(); ctx.ellipse(x, y + 3, 2.6, 5, 0, 0, TAU); ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(190,205,200,0.6)'; ctx.lineWidth = 1.6; ctx.stroke(); }
  }
  for (let i = 0; i < tune.calor_max; i++) { // calor: tracinhos; cada três pagam uma cura
    const x = 36 + i * 11 + Math.floor(i / tune.heal_cost) * 6, on = i < state.calor;
    ctx.fillStyle = on ? PAL.sprout : 'rgba(190,205,200,0.3)'; ctx.fillRect(x, 70, 8, on ? 5 : 3);
  }

  ctx.fillStyle = PAL.emberHot; ctx.beginPath(); ctx.moveTo(bx, 38); ctx.lineTo(bx + 7, 46); ctx.lineTo(bx, 54); ctx.lineTo(bx - 7, 46); ctx.closePath(); ctx.fill();
  text(String(state.brasas), bx + 16, 47, 22, '#e6efe9', 'left');

  if (state.banner) { const b = state.banner, a = clamp(b.t * 2, 0, 1) * clamp((b.dur - b.t) * 1.5, 0, 1);
    textGlow(ctx, b.title, W / 2, H * 0.74, 40, '#f4efe2', '#000', a); if (b.sub) textGlow(ctx, b.sub, W / 2, H * 0.74 + 42, 22, '#d6e2de', '#000', a); }
  if (fx.eco) { // o eco: um resto de voz, no alto da tela
    const e = fx.eco, a = clamp(e.t * 1.5, 0, 1) * clamp((6.5 - e.t) * 1.2, 0, 1), lines = wrapLines(ctx, e.text.slice(0, Math.floor(e.t * 30)), 28, 820);
    lines.forEach((ln, i) => textGlow(ctx, ln, W / 2, 150 + i * 38, 28, '#eefcf8', PAL.sproutDeep, a, 'center', true));

}
function drawMap(ox, oy, u, v) { // o mapa se preenche sala a sala; marca as travas que você viu
  for (const id of Object.keys(ROOMS)) {
    if (!state.seen[id]) continue;
    const r = ROOMS[id], x = ox + r.map.x * u, y = oy + r.map.y * v, w = r.map.w * u - 8, h = r.map.h * v - 8, here = id === state.room;
    ctx.fillStyle = here ? 'rgba(143,196,189,0.3)' : 'rgba(143,196,189,0.12)'; ctx.strokeStyle = here ? PAL.rim : 'rgba(143,196,189,0.5)'; ctx.lineWidth = here ? 2.4 : 1.4;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
    ctx.font = `16px ${FONT}`; const fs = Math.max(14, Math.min(16, Math.floor(16 * (w - 10) / ctx.measureText(r.name).width))); // nomes longos encolhem para caber
    text(r.name, x + w / 2, y + h / 2, fs, here ? '#f0f5f2' : '#c2d2cd');
    for (const b of r.brotos) if (state.lit[b.id]) { ctx.fillStyle = PAL.sprout; ctx.beginPath(); ctx.arc(x + (b.x / r.w) * w, y + h - 9, 4, 0, TAU); ctx.fill(); }
    const locked = (id === 'R2' && state.flags.ravina && !state.seen.R6) || (id === 'R7' && state.flags.muro && !state.flags.asas);
    if (locked) { const lx = x + (r.lock.x / r.w) * w, ly = y + h - 12; ctx.strokeStyle = PAL.violet; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(lx - 6, ly - 6); ctx.lineTo(lx + 6, ly + 6); ctx.moveTo(lx + 6, ly - 6); ctx.lineTo(lx - 6, ly + 6); ctx.stroke(); }
    if (here) { const p = state.p; ctx.fillStyle = PAL.ember; ctx.beginPath(); ctx.arc(x + clamp((p.x / (r.w * T)), 0.05, 0.95) * w, y + 10 + clamp(p.y / (r.h * T), 0, 1) * (h - 24), 4.5, 0, TAU); ctx.fill(); }

}
function drawTitleBack() {
  fx.titleT += 1 / 60; const r = ROOMS.R7; if (!fx.titleArt) fx.titleArt = buildRoomArt(r);
  const a = fx.titleArt, cx = 20 + Math.sin(fx.titleT * 0.05) * 20;
  ctx.drawImage(a.sky, 0, 0); for (const L of a.layers) ctx.drawImage(L.c, -Math.round(cx * L.par), 0);
  drawAsh(ctx, fx.titleT, cx, 0, false, 'limiar'); drawFog(ctx, fx.titleT, cx, 'limiar', 0.2);
  ctx.drawImage(a.back, -cx, 0); ctx.drawImage(a.terrain, -cx, 0);
  drawBroto(ctx, 14 * T + 20 - cx, 14 * T, true, fx.titleT);
  drawPlayer(ctx, 470 - cx, 14 * T, { face: 1, t: fx.titleT, vx: 0, vy: 0, ground: true, atk: -1 });
  drawAsh(ctx, fx.titleT, cx, 0, true, 'limiar'); if (a.fore) ctx.drawImage(a.fore.c, -Math.round(cx * 1.3), 0);
  ctx.fillStyle = 'rgba(3,5,10,0.5)'; ctx.fillRect(0, 0, W, H); drawVignette(ctx);
}

// ---- Scenes: title, play, pause, results, figures -----------------------------------------
// figures: every enemy kind and unit side by side, for the outline check (?scene=figures).
// The checks look for play by name.
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0e2a31'); g.addColorStop(1, '#1f575b'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = PAL.ink; ctx.fillRect(0, 470, W, H - 470); ctx.strokeStyle = rgba(PAL.ash, 0.5); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(0, 470); ctx.lineTo(W, 470); ctx.stroke();
      const t = state.t, y = 470, lab = (n, x, row) => text(n, x, 512 + row * 30, 20, '#e6efe9');
      drawPlayer(ctx, 80, y, { face: 1, t, vx: 0, vy: 0, ground: true, atk: -1 }); lab('A figura', 80, 0);
      drawBroto(ctx, 190, y, true, t); lab('Broto', 190, 1);
      drawCarcaca(ctx, 320, y, { face: 1, t, st: 'walk', p: 0, rise: 1 }); lab('Carcaça', 320, 0);
      drawMariposa(ctx, 470, y - 90, { face: 1, t, st: 'hover' }); lab('Mariposa de Fuligem', 470, 1);
      drawEspinheiro(ctx, 620, y, { face: 1, t, st: 'walk', p: 0 }); lab('Espinheiro', 620, 0);
      drawVigia(ctx, 790, y, { face: 1, t, st: 'idle' }); lab('O Vigia Oco', 790, 1);
      drawRainha(ctx, 990, y - 130, { face: 1, t, st: 'hover' }); lab('A Rainha de Fuligem', 990, 0);
      drawEnlutada(ctx, 1190, y - 30, { face: -1, t, st: 'idle', arms: 0 }); lab('A Enlutada', 1190, 1);
      text('Sono de Cinza: as figuras', W / 2, 60, 30, '#e6efe9');
    },
  },
  title: {
    update() {
      const sv = loadSave();
      if (pressed('KeyN') && sv) { wipeSave(); reset(); scene = 'play'; sfx('wake'); return; }
      if (confirmTap()) { if (sv) continueGame(sv); else reset(); scene = 'play'; sfx('wake'); }
    },
    draw() {
      drawTitleBack(); const sv = loadSave();
      textGlow(ctx, TITLE, W / 2, 170, 92, '#f4efe2', PAL.violet, 1);
      text('uma floresta queimada · um sono do qual se acorda', W / 2, 242, 22, '#cfdcd8');
      if (touchUI) { text('Toque nos botões da tela: andar à esquerda; pular, golpear, ímpeto e curar à direita', W / 2, 350, 22, '#dbe6e2'); text('Segure o botão da chama, parado, para curar', W / 2, 386, 22, '#dbe6e2'); text('No ar, segure a chama e golpeie: o golpe vai para baixo e quica', W / 2, 422, 22, '#dbe6e2'); }
      else CONTROLS.forEach((c, i) => text(c, W / 2, 330 + i * 34, 21, '#dbe6e2'));
      const a = 0.6 + 0.4 * Math.sin(fx.titleT * 3);
      textGlow(ctx, touchUI ? (sv ? 'Toque para continuar' : 'Toque para começar') : (sv ? 'Enter: continuar de onde acordou' : 'Enter para começar'), W / 2, H - 110, 30, '#ffffff', PAL.sproutDeep, a);
      if (sv) text(touchUI ? 'Toque aqui embaixo para recomeçar do zero' : 'N: recomeçar do zero', W / 2, H - 56, 20, '#c6d4d0');
    },
  },
  play: {
    update(dt) {
      if (tapped('pause') && state.mode === 'play') { scene = 'pause'; fx.confirmNew = 0; return; }
      playStep(dt);
    },
    draw() {
      if (state.mode === 'vortex' || state.mode === 'black') {
        if (state.mode === 'vortex' && !fx.snap) { // guarda o último quadro do mundo, para rasgá-lo
          fx.snap = mk(640, 360); try { fx.snap.getContext('2d').drawImage(canvas, 0, 0, 640, 360); } catch (e) { fx.snap = null; }
          fx.shards = []; const cols = 8, rows = 5, sw = W / cols, sh = H / rows;
          for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const x = i * sw + sw / 2 - W / 2, y = j * sh + sh / 2 - H * 0.46; fx.shards.push({ sx: i * sw, sy: j * sh, sw, sh, ang: Math.atan2(y / 0.8, x), dist: Math.hypot(x, y / 0.8), d: vr(), sp: vr() * 2, rot: (vr() - 0.5) * 5 }); }
        }
        const p = state.mode === 'black' ? 1 : clamp(state.modeT / 2.6, 0, 1);
        drawVortex(ctx, p, state.t, fx.snap, fx.shards);
        if (state.mode === 'vortex') { // a figura caindo no centro
          const k = clamp(state.modeT / 2.6, 0, 1), s = 1.5 * (1 - k * 0.9), a = state.modeT * 2.4, d = 190 * (1 - k);
          ctx.save(); ctx.translate(W / 2 + Math.cos(a) * d, H * 0.46 + Math.sin(a) * d * 0.7); ctx.rotate(a * 1.3); ctx.scale(s, s); ctx.globalAlpha = 1 - k * 0.7;
          drawPlayer(ctx, 0, 20, { face: 1, t: state.t, vx: 0, vy: -200, ground: false, atk: -1, emberA: 1 - k }); ctx.restore();
          if (state.killLine) { // quem te matou, e o que ele lembra
            const a2 = clamp((state.modeT - 1.1) / 0.8, 0, 1) * clamp((5.2 - state.modeT) * 2, 0, 1), lines = wrapLines(ctx, '“' + state.killLine + '”', 34, 900);
            ctx.fillStyle = `rgba(5,3,12,${0.55 * a2})`; ctx.fillRect(0, H - 220, W, 220);
            lines.forEach((ln, i) => textGlow(ctx, ln, W / 2, H - 150 + i * 42 - (lines.length - 1) * 21, 34, '#f6efff', PAL.violet, a2, 'center', true));
            textGlow(ctx, state.killBy === 'sono' ? `O Sono · ${state.totalDeaths}ª morte` : `${LINES[state.killer].name} · ${state.killCount}ª vez`, W / 2, H - 62, 21, '#d9c9f5', '#000', a2);
          }
        }
        if (state.mode === 'vortex' && state.modeT < 0.25) { ctx.fillStyle = `rgba(255,255,255,${1 - state.modeT / 0.25})`; ctx.fillRect(0, 0, W, H); }
        if (state.mode === 'vortex') { const dur = state.killLine ? 5.2 : 3.2, f = clamp((state.modeT - (dur - 0.7)) / 0.7, 0, 1); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); } }
        if (state.mode === 'black') { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
        return;
      }
      drawWorld();
      if (state.mode === 'dying') { const k = clamp(state.modeT / 0.9, 0, 1); glow(ctx, W / 2, H / 2, 900, PAL.violet, 0.5 * k); ctx.fillStyle = `rgba(20,8,40,${0.5 * k})`; ctx.fillRect(0, 0, W, H); }
      if (state.mode === 'wake') { const dur = state.first ? 3.6 : 2.2, k = clamp(1 - state.modeT / (dur * 0.6), 0, 1); if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); } }
      else if (state.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${state.fade})`; ctx.fillRect(0, 0, W, H); }
      if (state.mode === 'ending') { const k = clamp(state.modeT / 4, 0, 1); glow(ctx, W / 2, H / 2, 1100, PAL.sprout, k); ctx.fillStyle = `rgba(235,255,248,${k * k})`; ctx.fillRect(0, 0, W, H); }
      if (state.p.inv > tune.hurt_invuln - 0.25 && state.mode === 'play') { const k = (state.p.inv - (tune.hurt_invuln - 0.25)) / 0.25; glow(ctx, W / 2, H / 2, 1000, '#ff3a5a', 0.16 * k); }
      if (state.mode !== 'wake' || !state.first) drawHUD();
    },
  },
  pause: {
    update() {
      if (fx.confirmNew > 0) fx.confirmNew -= STEP;
      if (tapped('pause')) { scene = 'play'; return; }
      if (pressed('KeyN')) { if (fx.confirmNew > 0) { wipeSave(); reset(); scene = 'play'; } else fx.confirmNew = 3; }
    },
    draw() {
      drawWorld(); ctx.fillStyle = 'rgba(3,6,9,0.78)'; ctx.fillRect(0, 0, W, H);
      textGlow(ctx, 'Pausa', W / 2, 70, 44, '#f4efe2', '#000', 1);
      drawMap(W / 2 - 4 * 152 + 4, 120, 152, 92);
      const reg = Object.keys(state.deaths).filter(k => state.deaths[k] > 0 && LINES[k]).sort((a, b) => state.deaths[b] - state.deaths[a]);
      const colC = touchUI || !reg.length ? -1 : 370, colR = !reg.length ? -1 : touchUI ? W / 2 : 910, y0 = 356;
      if (!touchUI) CONTROLS.forEach((c, i) => text(c, reg.length ? colC : W / 2, y0 + i * 29, reg.length ? 17 : 19, '#d3dfdb'));
      if (reg.length) { // o que lembra de você: quem te matou, e quantas vezes
        text('O que lembra de você', colR, y0, 22, '#e7dcff');
        reg.slice(0, 6).forEach((k, i) => { const n = state.deaths[k], top = topHow(k); text(`${LINES[k].name} · ${n} ${n === 1 ? 'vez' : 'vezes'}${mem(k) && k !== 'floresta' ? ' · já luta diferente' : ''}`, colR, y0 + 34 + i * 28, 18, mem(k) ? '#d9c2ff' : '#d3dfdb'); });
      }
      const ecosN = Object.keys(state.ecos).length, dn = state.dir.changes;
      if (dn > 0) text(`O sono mexeu na floresta ${dn} ${dn === 1 ? 'vez' : 'vezes'}`, W / 2, H - 130, 19, '#cdb6f5');
      text(`Mortes: ${state.totalDeaths} · Brasas: ${state.brasas} · Segredos: ${(state.flags.lamina ? 1 : 0) + (state.flags.fragmento ? 1 : 0)} de 2 · Ecos: ${ecosN} de 7`, W / 2, H - 96, 21, '#e6efe9');
      text(touchUI ? 'Toque no botão de pausa para voltar' : (fx.confirmNew > 0 ? 'Aperte N de novo para apagar tudo e recomeçar' : 'P: voltar · N: recomeçar do zero'), W / 2, H - 56, 20, fx.confirmNew > 0 ? '#ffb9c6' : '#c6d4d0');
    },
  },
  results: {
    update() { if (confirmTap()) { reset(); scene = 'title'; } },
    draw() {
      drawTitleBack(); ctx.fillStyle = 'rgba(210,255,240,0.1)'; ctx.fillRect(0, 0, W, H);
      textGlow(ctx, state.gained || 'Você acordou.', W / 2, 210, 78, '#f6fff9', PAL.sproutDeep, 1);
      const m = Math.floor(state.time / 60), s = Math.floor(state.time % 60);
      text(`Você morreu ${state.totalDeaths} ${state.totalDeaths === 1 ? 'vez' : 'vezes'} e acordou todas elas.`, W / 2, 320, 26, '#e6efe9');
      text(`Tempo desperta: ${m} min ${s < 10 ? '0' : ''}${s} s · Brasas: ${state.brasas} · Segredos: ${(state.flags.lamina ? 1 : 0) + (state.flags.fragmento ? 1 : 0)} de 2 · Ecos: ${Object.keys(state.ecos).length} de 7`, W / 2, 364, 22, '#d3dfdb');
      if (state.dir.changes > 0) text(`O sono mexeu na floresta ${state.dir.changes} ${state.dir.changes === 1 ? 'vez' : 'vezes'} enquanto você dormia.`, W / 2, 402, 21, '#cdb6f5');
      text('Esta é uma fatia: a floresta continua depois daqui.', W / 2, 446, 21, '#d3dfdb');
      text(touchUI ? 'Toque para voltar ao início' : 'Enter para voltar ao início', W / 2, H - 90, 26, '#ffffff');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  pollPad();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  get director() { return DRT; }, // o que o Sono tem na cabeça; DRT.force = 'extra' força o próximo gesto
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
